<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복지 방문 데이터 통합 대시보드</title>
    <!-- Leaflet 지도 라이브러리 (도메인 제한 없음) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body {
            font-family: 'Malgun Gothic', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            background: #f0f2f5;
        }
        #sidebar {
            width: 360px;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 10;
            overflow-y: auto;
        }
        h2 { font-size: 20px; color: #2c3e50; margin-top: 0; }
        .stats-box {
            background: #eef2f7;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .stats-box h3 { margin: 0 0 6px 0; font-size: 13px; color: #555; }
        .stats-box p { margin: 0; font-size: 16px; font-weight: bold; color: #2980b9; }
        
        .filter-section {
            background: #fdfefe;
            border: 1px solid #dcdde1;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .filter-section h4 { margin: 0 0 6px 0; font-size: 13px; color: #2c3e50; }
        .filter-section select {
            width: 100%;
            padding: 8px;
            border-radius: 6px;
            border: 1px solid #bdc3c7;
            font-size: 13px;
            box-sizing: border-box;
        }

        .legend-box {
            background: #fff;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
        }
        .legend-box h4 { margin: 0 0 8px 0; font-size: 13px; color: #333; }
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 12px;
            margin-bottom: 6px;
            color: #555;
        }
        .color-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }

        #map {
            flex-grow: 1;
            height: 100%;
        }
        .info-desc {
            font-size: 12px;
            color: #666;
            margin-top: auto;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>📊 기관별 방문 분석</h2>
        <div class="stats-box">
            <h3>총 방문 건수</h3>
            <p id="totalCount">0 건 (부산진구 전체)</p>
        </div>

        <!-- 📅 기간별 조회 -->
        <div class="filter-section">
            <h4>📅 기간별 조회</h4>
            <select id="periodFilter" onchange="filterData()">
                <option value="year">연간 통합 보기 (2026년)</option>
                <option value="1">1월</option>
                <option value="2">2월</option>
                <option value="3">3월</option>
                <option value="4">4월</option>
                <option value="5">5월</option>
                <option value="6">6월</option>
                <option value="7">7월</option>
                <option value="8">8월</option>
                <option value="9">9월</option>
                <option value="10">10월</option>
                <option value="11">11월</option>
                <option value="12">12월</option>
            </select>
        </div>

        <!-- 🎯 방문 목적별 필터 -->
        <div class="filter-section">
            <h4>🎯 방문 목적별 필터</h4>
            <select id="purposeFilter" onchange="filterData()">
                <option value="all">전체 목적 보기</option>
                <option value="홍보">홍보</option>
                <option value="사각지대발굴 활동">사각지대발굴 활동</option>
                <option value="사례관리(방문)">사례관리(방문)</option>
            </select>
        </div>

        <!-- 🗺️ 범례 -->
        <div class="legend-box">
            <h4>🗺️ 방문 횟수별 구역 색상</h4>
            <div class="legend-item">
                <span class="color-dot" style="background: #c0392b;"></span>
                <span><b>50회 이상</b> (초집중 관리 지역)</span>
            </div>
            <div class="legend-item">
                <span class="color-dot" style="background: #e67e22;"></span>
                <span><b>10회 ~ 30회</b> (중점 방문 지역)</span>
            </div>
            <div class="legend-item">
                <span class="color-dot" style="background: #3498db;"></span>
                <span><b>1회 ~ 10회</b> (기본 방문 / 관심 지역)</span>
            </div>
        </div>

        <div class="info-desc">
            💡 <b>안내:</b> 부산진구 행정 대시보드이며, 오픈소스 맵 엔진으로 도메인 차단 없이 안정적으로 구동됩니다.
        </div>
    </div>

    <div id="map"></div>

    <script>
        // 1. 지도 초기화 (부산진구 중심 좌표)
        var map = L.map('map').setView([35.1631, 129.0532], 13);

        // 오픈스트리트맵 타일 레이어 추가
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // 2. 부산진구 대략적 경계 라인 (샘플)
        var busanjinCoords = [
            [35.1850, 129.0350],
            [35.1880, 129.0600],
            [35.1750, 129.0820],
            [35.1550, 129.0780],
            [35.1350, 129.0620],
            [35.1380, 129.0400],
            [35.1520, 129.0150]
        ];

        var busanjinPolygon = L.polygon(busanjinCoords, {
            color: '#27ae60',
            weight: 3,
            fillColor: '#27ae60',
            fillOpacity: 0.06
        }).addTo(map);

        // 3. 실제 데이터 배열 (현재는 빈 상태)
        var allVisitData = [];
        var activeLayers = [];

        function clearMap() {
            activeLayers.forEach(function(layer) { map.removeLayer(layer); });
            activeLayers = [];
        }

        function filterData() {
            clearMap();

            var selectedPeriod = document.getElementById('periodFilter').value;
            var selectedPurpose = document.getElementById('purposeFilter').value;

            var filtered = allVisitData.filter(function(item) {
                var matchPeriod = (item.period === selectedPeriod);
                var matchPurpose = (selectedPurpose === 'all' || item.purpose === selectedPurpose);
                return matchPeriod && matchPurpose;
            });

            var totalSum = filtered.reduce((sum, item) => sum + item.count, 0);
            document.getElementById('totalCount').innerText = totalSum + " 건 (부산진구 전체)";

            filtered.forEach(function(item) {
                var radiusSize, circleColor;
                if (item.count >= 50) {
                    radiusSize = 300;
                    circleColor = '#c0392b';
                } else if (item.count >= 10) {
                    radiusSize = 200;
                    circleColor = '#e67e22';
                } else {
                    radiusSize = 120;
                    circleColor = '#3498db';
                }

                var circle = L.circle([item.lat, item.lng], {
                    radius: radiusSize,
                    color: circleColor,
                    weight: 2,
                    fillColor: circleColor,
                    fillOpacity: 0.45
                }).addTo(map);

                circle.bindPopup(`<b>📍 ${item.title}</b><br>목적: ${item.purpose}<br>방문: ${item.count}회`);
                activeLayers.push(circle);
            });
        }

        filterData();
    </script>
</body>
</html>
