<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복지 방문 대시보드 - 카카오맵</title>
    <style>
        body { margin: 0; padding: 0; display: flex; height: 100vh; font-family: 'Malgun Gothic', sans-serif; background: #f0f2f5; }
        #sidebar { width: 360px; background: #fff; padding: 20px; box-sizing: border-box; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 10; overflow-y: auto; }
        #map { flex-grow: 1; height: 100%; }
        h2 { font-size: 18px; color: #2c3e50; margin-top: 0; }
        .info { font-size: 13px; color: #555; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>📊 부산진구 복지 대시보드</h2>
        <div class="info">
            <p><b>카카오맵 연동 화면</b></p>
            <p>직원들이 기록한 데이터가 이 카카오 지도 위에 실시간으로 표시됩니다.</p>
        </div>
    </div>

    <div id="map"></div>

    <!-- 카카오 지도 API (가장 원본 형태의 표준 스크립트 호출) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9821f83fe3895fe4e030aee5107a8990"></script>
    <script>
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(35.1631, 129.0532), // 부산진구 중심
            level: 5
        };

        var map = new kakao.maps.Map(container, options);
    </script>
</body>
</html>
