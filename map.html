<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복지 방문 인증 및 대시보드</title>
    <!-- 카카오맵 API (clusterer 포함) -->
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9821f83fe3895fe4e030aee5107a8990&libraries=services,clusterer"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #f0f2f5; overflow: hidden; }
        
        #left-menu { width: 260px; background: #1e1e2f; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 100; }
        .menu-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #2d2d44; color: #ecf0f1; }
        .menu-list { display: flex; flex-direction: column; padding: 15px 10px; gap: 8px; }
        .menu-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 15px; border: none; background: transparent; color: #adb5bd; font-size: 15px; font-weight: bold; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { background: #2a2a40; color: #fff; }
        .menu-btn.active { background: #27ae60; color: #fff; }

        .main-container { flex-grow: 1; height: 100vh; position: relative; background: #f0f2f5; overflow: hidden; }
        .tab-pane { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; box-sizing: border-box; background: #f0f2f5; }
        .tab-pane.active { display: flex; }

        #dash-pane { display: flex; flex-direction: row; width: 100%; height: 100%; }
        #dash-sidebar { width: 340px; background: #ffffff; padding: 0 20px 20px 20px; box-sizing: border-box; overflow-y: auto; flex-shrink: 0; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        #map { flex-grow: 1; height: 100%; }

        #auth-pane { justify-content: center; align-items: center; padding: 20px; z-index: 30; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; box-sizing: border-box; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 18px; font-weight: bold; font-size: 15px; color: #333; }
        select { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box; background: #fff; }
        .info-msg { font-size: 13px; color: #2980b9; margin-top: 15px; text-align: center; background: #eef2f7; padding: 12px; border-radius: 6px; font-weight: bold; }
        button[type="submit"] { width: 100%; background: #27ae60; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.2s; }
        button[type="submit"]:hover { background: #219653; }

        .stats-box { background: #eef2f7; padding: 12px; border-radius: 8px; margin-bottom: 12px; margin-top: 15px; }
        .stats-box h3 { margin: 0 0 4px 0; font-size: 12px; color: #555; }
        .stats-box p { margin: 0; font-size: 16px; font-weight: bold; color: #2980b9; }
        .filter-section { background: #fdfefe; border: 1px solid #dcdde1; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .filter-section h4 { margin: 0 0 4px 0; font-size: 12px; color: #2c3e50; }
        .filter-section select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #bdc3c7; font-size: 12px; box-sizing: border-box; }
        
        .chart-box { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .chart-box h4 { margin: 0 0 10px 0; font-size: 12px; color: #333; }

        .drag-handle-wrap { display: none; } /* 데스크탑에서는 숨김 */

        /* 스마트폰 모바일 화면을 위한 반응형 CSS (바텀 시트 구현) */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            #left-menu { width: 100%; flex-direction: row; height: auto; padding: 0; }
            .menu-header { display: none; }
            .menu-list { flex-direction: row; padding: 10px; width: 100%; justify-content: space-around; }
            .menu-btn { justify-content: center; padding: 12px; font-size: 14px; width: 45%; }
            
            #dash-pane { display: block; position: relative; height: calc(100vh - 60px); }
            #map { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
            
            #dash-sidebar { 
                position: absolute; 
                bottom: 0; 
                left: 0; 
                width: 100%; 
                height: 85vh; /* 창을 위로 최대로 올렸을 때 높이 */
                z-index: 10; 
                border-radius: 20px 20px 0 0; 
                transform: translateY(calc(85vh - 40vh)); /* 기본: 40vh 정도만 보이게 (절반) */
                transition: transform 0.3s ease-out;
                padding-top: 0;
            }

            .drag-handle-wrap {
                display: flex;
                width: 100%;
                height: 40px;
                justify-content: center;
                align-items: center;
                cursor: grab;
                background-color: transparent;
            }
            .drag-handle {
                width: 50px; height: 5px; background: #bdc3c7; border-radius: 3px;
            }
            
            #auth-pane { height: calc(100vh - 60px); }
        }
    </style>
</head>
<body>

    <div id="left-menu">
        <div class="menu-header">📍 복지 방문 시스템</div>
        <div class="menu-list">
            <button class="menu-btn active" onclick="switchTab('dash-pane', this)">🗺️ 지도 대시보드</button>
            <button class="menu-btn" onclick="switchTab('auth-pane', this)">📍 현장 방문 인증</button>
        </div>
    </div>

    <div class="main-container">
        
        <div id="dash-pane" class="tab-pane active">
            <div id="map"></div>
            <div id="dash-sidebar">
                <!-- 모바일 터치 드래그 영역 -->
                <div class="drag-handle-wrap" id="dragHandleWrap">
                    <div class="drag-handle"></div>
                </div>

                <h2>📊 방문 분석</h2>
                <div class="stats-box">
                    <h3>총 방문 건수</h3>
                    <p id="totalCount">0 건 (선택 지역)</p>
                </div>

                <div class="filter-section">
                    <h4>🌐 권역별 조회</h4>
                    <select id="regionFilter" onchange="onRegionChange()">
                        <option value="all">전체 권역 보기</option>
                        <option value="1권역">1권역 (부전1·연지·초읍·양정1·2동)</option>
                        <option value="2권역">2권역 (부전2·전포1·2·범천1·2동)</option>
                        <option value="3권역">3권역 (당감1·2·4·부암1·3동)</option>
                        <option value="4권역">4권역 (가야2·개금1·2·3동)</option>
                    </select>
                </div>

                <div class="filter-section">
                    <h4>🏠 동별 조회</h4>
                    <select id="dongFilter" onchange="onDongChange()">
                        <option value="all">전체 동 보기</option>
                        <option value="부전1동">부전1동</option><option value="부전2동">부전2동</option>
                        <option value="연지동">연지동</option><option value="초읍동">초읍동</option>
                        <option value="양정1동">양정1동</option><option value="양정2동">양정2동</option>
                        <option value="전포1동">전포1동</option><option value="전포2동">전포2동</option>
                        <option value="부암1동">부암1동</option><option value="부암3동">부암3동</option>
                        <option value="당감1동">당감1동</option><option value="당감2동">당감2동</option>
                        <option value="당감4동">당감4동</option><option value="가야1동">가야1동</option>
                        <option value="가야2동">가야2동</option><option value="개금1동">개금1동</option>
                        <option value="개금2동">개금2동</option><option value="개금3동">개금3동</option>
                        <option value="범천1동">범천1동</option><option value="범천2동">범천2동</option>
                    </select>
                </div>

                <div class="filter-section">
                    <h4>📅 기간별 조회</h4>
                    <select id="periodFilter" onchange="filterData()">
                        <option value="year">연간 통합 보기 (전체)</option>
                        <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option><option value="4">4월</option>
                        <option value="5">5월</option><option value="6">6월</option><option value="7">7월</option><option value="8">8월</option>
                        <option value="9">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
                    </select>
                </div>

                <div class="filter-section">
                    <h4>🎯 방문 목적별 필터</h4>
                    <select id="purposeFilter" onchange="filterData()">
                        <option value="all">전체 목적 보기</option>
                        <option value="홍보">홍보</option>
                        <option value="사각지대발굴 활동">사각지대발굴 활동</option>
                        <option value="사례관리(방문)">사례관리(방문)</option>
                    </select>
                </div>

                <div class="chart-box">
                    <h4>📊 카테고리별 방문 현황</h4>
                    <div style="position: relative; height: 160px; width: 100%;">
                        <canvas id="purposeChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="auth-pane" class="tab-pane">
            <div class="card">
                <h2>📍 복지 방문 인증</h2>
                <form id="visitForm">
                    <label>🏠 방문 지역(동) 선택</label>
                    <select id="authDong">
                        <option value="부전1동">부전1동</option><option value="부전2동">부전2동</option>
                        <option value="연지동">연지동</option><option value="초읍동">초읍동</option>
                        <option value="양정1동">양정1동</option><option value="양정2동">양정2동</option>
                        <option value="전포1동">전포1동</option><option value="전포2동">전포2동</option>
                        <option value="부암1동" selected>부암1동</option><option value="부암3동">부암3동</option>
                        <option value="당감1동">당감1동</option><option value="당감2동">당감2동</option>
                        <option value="당감4동">당감4동</option><option value="가야1동">가야1동</option>
                        <option value="가야2동">가야2동</option><option value="개금1동">개금1동</option>
                        <option value="개금2동">개금2동</option><option value="개금3동">개금3동</option>
                        <option value="범천1동">범천1동</option><option value="범천2동">범천2동</option>
                    </select>

                    <label>🎯 방문 목적 선택</label>
                    <select id="purpose">
                        <option value="홍보">홍보</option>
                        <option value="사각지대발굴 활동">사각지대발굴 활동</option>
                        <option value="사례관리(방문)">사례관리(방문)</option>
                    </select>
                    <div class="info-msg">💡 전송 버튼을 누르면 현재 위치가 자동으로 기록됩니다.</div>
                    <button type="submit" id="submitBtn">인증 데이터 전송하기</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // ------------------ 모바일 패널 스와이프 로직 ------------------
        let startY = 0;
        let currentTransform = 1; // 0: 전체 펼침(0), 1: 반만 펼침(40vh), 2: 내림(지도 위주)
        const sidebar = document.getElementById('dash-sidebar');
        const dragHandleWrap = document.getElementById('dragHandleWrap');

        dragHandleWrap.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        }, {passive: true});

        dragHandleWrap.addEventListener('touchend', (e) => {
            let endY = e.changedTouches[0].clientY;
            let diff = endY - startY;
            
            if (diff < -30) { // 위로 올림 (스와이프 업)
                if (currentTransform === 2) currentTransform = 1;
                else if (currentTransform === 1) currentTransform = 0;
            } else if (diff > 30) { // 아래로 내림 (스와이프 다운)
                if (currentTransform === 0) currentTransform = 1;
                else if (currentTransform === 1) currentTransform = 2;
            }
            applySidebarState();
        });

        // 클릭으로도 제어 가능하게 추가
        dragHandleWrap.addEventListener('click', () => {
            if (currentTransform === 1) currentTransform = 0;
            else if (currentTransform === 0) currentTransform = 2;
            else currentTransform = 1;
            applySidebarState();
        });

        function applySidebarState() {
            if (window.innerWidth > 768) return; 
            if (currentTransform === 0) {
                sidebar.style.transform = 'translateY(0)'; // 지도를 덮으면서 최대로 올라옴
            } else if (currentTransform === 1) {
                sidebar.style.transform = 'translateY(calc(85vh - 40vh))'; // 반만 걸쳐짐
            } else if (currentTransform === 2) {
                sidebar.style.transform = 'translateY(calc(85vh - 65px))'; // 손잡이만 남기고 바닥으로 내려감
            }
        }

        window.addEventListener('resize', () => {
            if (window.innerWidth > 768) {
                sidebar.style.transform = 'none'; // 데스크탑은 스와이프 효과 끄기
            } else {
                applySidebarState();
            }
        });
        // -------------------------------------------------------------

        function switchTab(paneId, btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');
            btn.classList.add('active');
            if(paneId === 'dash-pane' && map) {
                setTimeout(() => { map.relayout(); }, 100);
            }
        }

        var container = document.getElementById('map');
        var options = { center: new kakao.maps.LatLng(35.1631, 129.0532), level: 6, minLevel: 4, maxLevel: 8 };
        var map = new kakao.maps.Map(container, options);

        // 프라이버시 보호용: 지도에는 항상 각 동의 정중앙에 데이터가 뭉쳐서 그려지도록 중앙 좌표 지정
        const dongLocations = {
            "부전1동": {lat: 35.1585, lng: 129.0605}, "부전2동": {lat: 35.1542, lng: 129.0598},
            "연지동": {lat: 35.1740, lng: 129.0570}, "초읍동": {lat: 35.1805, lng: 129.0515},
            "양정1동": {lat: 35.1690, lng: 129.0735}, "양정2동": {lat: 35.1645, lng: 129.0740},
            "전포1동": {lat: 35.1565, lng: 129.0665}, "전포2동": {lat: 35.1500, lng: 129.0710},
            "부암1동": {lat: 35.1650, lng: 129.0530}, "부암3동": {lat: 35.1720, lng: 129.0380},
            "당감1동": {lat: 35.1610, lng: 129.0320}, "당감2동": {lat: 35.1555, lng: 129.0350},
            "당감4동": {lat: 35.1650, lng: 129.0270}, "가야1동": {lat: 35.1480, lng: 129.0360},
            "가야2동": {lat: 35.1430, lng: 129.0320}, "개금1동": {lat: 35.1485, lng: 129.0210},
            "개금2동": {lat: 35.1530, lng: 129.0200}, "개금3동": {lat: 35.1590, lng: 129.0140},
            "범천1동": {lat: 35.1425, lng: 129.0595}, "범천2동": {lat: 35.1380, lng: 129.0530}
        };

        const regionMap = {
            "1권역": ["부전1동", "연지동", "초읍동", "양정1동", "양정2동"],
            "2권역": ["부전2동", "전포1동", "전포2동", "범천1동", "범천2동"],
            "3권역": ["당감1동", "당감2동", "당감4동", "부암1동", "부암3동"],
            "4권역": ["가야2동", "개금1동", "개금2동", "개금3동"]
        };

        // 클러스터러: 실제 집 위치를 숨기고 "숫자"로만 요약해주는 핵심 라이브러리
        var clusterer = new kakao.maps.MarkerClusterer({
            map: map,
            averageCenter: true,
            minLevel: 1, // 무조건 클러스터링
            minClusterSize: 1, // 단 1건이라도 마커 모양 대신 둥근 배지로 표현!
            disableClickZoom: true, // 클릭해도 줌인되지 않음 (정확한 위치 숨김)
            calculator: [10, 50],
            styles: [{ 
                width : '40px', height : '40px', background: 'rgba(52, 152, 219, 0.9)', borderRadius: '20px',
                color: '#fff', textAlign: 'center', fontWeight: 'bold', lineHeight: '40px', border: '2px solid #fff', boxShadow: '0 2px 5px rgba(0,0,0,0.3)', fontSize: '14px'
            }, { 
                width : '50px', height : '50px', background: 'rgba(230, 126, 34, 0.9)', borderRadius: '25px',
                color: '#fff', textAlign: 'center', fontWeight: 'bold', lineHeight: '50px', border: '2px solid #fff', boxShadow: '0 2px 5px rgba(0,0,0,0.3)', fontSize: '15px'
            }, { 
                width : '60px', height : '60px', background: 'rgba(231, 76, 60, 0.9)', borderRadius: '30px',
                color: '#fff', textAlign: 'center', fontWeight: 'bold', lineHeight: '60px', border: '2px solid #fff', boxShadow: '0 2px 5px rgba(0,0,0,0.3)', fontSize: '16px'
            }]
        });

        let geojsonFeatureCollection = null;
        let allVisitData = [];
        let polygonOverlays = [];
        let purposeChart = null;

        function initChart() {
            const ctx = document.getElementById('purposeChart').getContext('2d');
            purposeChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['홍보', '사각지대', '사례관리'],
                    datasets: [{
                        label: '방문 건수',
                        data: [0, 0, 0],
                        backgroundColor: ['#3498db', '#e67e22', '#2ecc71'],
                        borderRadius: 4,
                        maxBarThickness: 30
                    }]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, 
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 } } }, x: { ticks: { font: { size: 11, weight: 'bold' } } } },
                    plugins: { legend: { display: false } }
                }
            });
        }
        initChart();

        fetch('busanjin.geojson')
            .then(res => res.json())
            .then(data => {
                geojsonFeatureCollection = data;
                drawPolygons('all');
                loadSheetData();
            })
            .catch(err => console.error("GeoJSON 로드 실패:", err));

        function clearMapPolygons() {
            polygonOverlays.forEach(p => p.setMap(null));
            polygonOverlays = [];
        }

        // 지도의 폴리곤을 직접 클릭했을 때 해당 동을 선택하는 기능
        window.selectDongFromMap = function(dongName) {
            var currentFilter = document.getElementById('dongFilter').value;
            if (currentFilter === dongName) {
                document.getElementById('regionFilter').value = 'all';
                document.getElementById('dongFilter').value = 'all';
            } else {
                document.getElementById('regionFilter').value = 'all';
                document.getElementById('dongFilter').value = dongName;
            }
            onDongChange();
        };

        function drawPolygons(targetFilter, isRegion = false) {
            clearMapPolygons();
            if (!geojsonFeatureCollection) return;

            var targetDongs = [];
            if (isRegion) {
                targetDongs = regionMap[targetFilter] || [];
            } else if (targetFilter !== 'all') {
                targetDongs = [targetFilter];
            }

            var bounds = new kakao.maps.LatLngBounds(); 
            var hasBounds = false;

            geojsonFeatureCollection.features.forEach(feature => {
                var dongName = String(feature.properties.ADM_NM || "").trim();
                var isActive = (targetFilter === 'all' || (isRegion && targetDongs.includes(dongName)) || (!isRegion && dongName === targetFilter));
                
                if (isActive || targetFilter !== 'all') { 
                    var coordinates = feature.geometry.coordinates;
                    
                    coordinates.forEach(ring => {
                        var path = ring.map(coord => new kakao.maps.LatLng(coord[1], coord[0]));
                        
                        var isAll = (targetFilter === 'all');
                        var polygon = new kakao.maps.Polygon({
                            path: path,
                            strokeWeight: isActive ? (isAll ? 2 : 3) : 1,
                            strokeColor: isActive ? (isAll ? '#27ae60' : (isRegion ? '#3498db' : '#e74c3c')) : '#bdc3c7',
                            strokeOpacity: isActive ? 0.8 : 0.3,
                            fillColor: isActive ? (isAll ? '#27ae60' : (isRegion ? '#3498db' : '#e74c3c')) : '#ecf0f1',
                            fillOpacity: isActive ? (isAll ? 0.03 : 0.25) : 0.0
                        });
                        polygon.setMap(map);
                        polygonOverlays.push(polygon);

                        if (isActive && targetFilter !== 'all') {
                            path.forEach(coord => bounds.extend(coord));
                            hasBounds = true;
                        }

                        // 동 이름 텍스트 라벨 코드 삭제됨 (요청 반영)

                        kakao.maps.event.addListener(polygon, 'click', function() {
                            window.selectDongFromMap(dongName);
                        });
                    });
                }
            });

            if (targetFilter !== 'all' && hasBounds) {
                map.setBounds(bounds);
            }
        }

        function onRegionChange() {
            document.getElementById('dongFilter').value = 'all';
            var region = document.getElementById('regionFilter').value;

            if (region !== 'all') {
                drawPolygons(region, true);
            } else {
                drawPolygons('all');
                map.setCenter(new kakao.maps.LatLng(35.1631, 129.0532));
                map.setLevel(6);
            }
            filterData();
        }

        function onDongChange() {
            document.getElementById('regionFilter').value = 'all';
            var dong = document.getElementById('dongFilter').value;
            
            if (dong !== 'all') {
                drawPolygons(dong, false);
            } else {
                drawPolygons('all');
                map.setCenter(new kakao.maps.LatLng(35.1631, 129.0532));
                map.setLevel(6);
            }
            filterData();
        }

        function filterData() {
            var selectedRegion = document.getElementById('regionFilter').value;
            var selectedDong = document.getElementById('dongFilter').value;
            var selectedPeriod = document.getElementById('periodFilter').value;
            var selectedPurpose = document.getElementById('purposeFilter').value;

            clusterer.clear(); // 기존 마커 지우기
            let markers = [];

            let promoCount = 0, blindCount = 0, caseCount = 0;
            var totalSum = 0;

            var filtered = allVisitData.filter(item => {
                var itemDong = String(item.dong || "").replace(/\s/g, "");
                var targetDong = selectedDong.replace(/\s/g, "");
                
                var matchRegion = true;
                if (selectedDong === 'all' && selectedRegion !== 'all') {
                    var allowedDongs = (regionMap[selectedRegion] || []).map(d => d.replace(/\s/g, ""));
                    matchRegion = allowedDongs.includes(itemDong);
                }
                
                var matchDong = (selectedDong === 'all' || itemDong === targetDong);
                var matchPeriod = (selectedPeriod === 'year' || String(item.period).trim() === String(selectedPeriod));
                var matchPurpose = (selectedPurpose === 'all' || String(item.purpose).trim() === String(selectedPurpose));

                return matchRegion && matchDong && matchPeriod && matchPurpose;
            });

            filtered.forEach(item => {
                var cnt = Number(item.count || 1);
                totalSum += cnt;

                var purposeStr = String(item.purpose).replace(/\s/g, "");
                if (purposeStr === '홍보') promoCount += cnt;
                else if (purposeStr.includes('사각지대')) blindCount += cnt;
                else if (purposeStr.includes('사례관리')) caseCount += cnt;

                // [핵심] 실제 위경도를 버리고, 해당 동의 중앙 좌표로 모든 마커를 겹치게 만듭니다!
                var itemDongClean = String(item.dong || "").trim();
                var overrideLoc = dongLocations[itemDongClean] || {lat: Number(item.lat), lng: Number(item.lng)};
                var position = new kakao.maps.LatLng(overrideLoc.lat, overrideLoc.lng);
                
                // 보이지 않는 가짜 마커 생성
                var marker = new kakao.maps.Marker({
                    position: position
                });

                markers.push(marker);
            });

            document.getElementById('totalCount').innerText = totalSum + " 건 (선택 지역)";

            if (purposeChart) {
                purposeChart.data.datasets[0].data = [promoCount, blindCount, caseCount];
                purposeChart.update();
            }

            // 모든 마커가 동별 센터 위치에 겹쳐있으므로, 클러스터러가 무조건 하나의 원으로 숫자(건수)만 예쁘게 보여줌
            clusterer.addMarkers(markers);
        }

        const sheetId = '1Qcqw-8UQPIVtgZLrpE3cD8qXH97qbHG9YL1Ww0GcJZQ';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        function loadSheetData() {
            const fetchUrl = url + "&_nocache=" + new Date().getTime();
            
            fetch(fetchUrl)
                .then(res => res.text())
                .then(text => {
                    const json = JSON.parse(text.substring(47).slice(0, -2));
                    const rows = json.table.rows;

                    allVisitData = rows.map(row => {
                        var dongVal = (row.c && row.c.length > 6 && row.c[6] && row.c[6].v) ? String(row.c[6].v) : '미지정';
                        return {
                            title: (row.c && row.c.length > 0 && row.c[0] && row.c[0].v) ? row.c[0].v : '현장 방문',
                            lat: (row.c && row.c.length > 1 && row.c[1] && row.c[1].v) ? row.c[1].v : 35.1631,
                            lng: (row.c && row.c.length > 2 && row.c[2] && row.c[2].v) ? row.c[2].v : 129.0532,
                            purpose: (row.c && row.c.length > 3 && row.c[3] && row.c[3].v) ? row.c[3].v : '홍보',
                            period: (row.c && row.c.length > 4 && row.c[4] && row.c[4].v) ? row.c[4].v : '8',
                            count: (row.c && row.c.length > 5 && row.c[5] && row.c[5].v) ? row.c[5].v : 1,
                            dong: dongVal
                        };
                    });

                    filterData();
                })
                .catch(err => console.error("구글 시트 데이터 로드 실패:", err));
        }

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyLAqE5AQPtZYau-mG3OgmH5TU48RhOGxLUD9DSgtIaOp1-1Nhtu0cSXdPc9l6YARNH/exec";

        document.getElementById('visitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "위치 확인 및 전송 중...";
            btn.disabled = true;

            const currentMonth = String(new Date().getMonth() + 1);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    sendData(position.coords.latitude, position.coords.longitude, currentMonth);
                }, function(error) {
                    sendData(35.1631, 129.0532, currentMonth);
                }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 });
            } else {
                sendData(35.1631, 129.0532, currentMonth);
            }
        });

        function sendData(lat, lng, period) {
            const data = {
                title: "현장 방문",
                lat: lat,
                lng: lng,
                purpose: document.getElementById('purpose').value,
                period: period,
                count: 1,
                dong: document.getElementById('authDong').value 
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                alert('방문 인증이 성공적으로 완료되었습니다!');
                const btn = document.getElementById('submitBtn');
                btn.innerText = "인증 데이터 전송하기";
                btn.disabled = false;
                document.getElementById('visitForm').reset();
                setTimeout(loadSheetData, 1500); 
            }).catch(error => {
                alert('전송 실패: ' + error);
                const btn = document.getElementById('submitBtn');
                btn.innerText = "인증 데이터 전송하기";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
