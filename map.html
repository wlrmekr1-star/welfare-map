<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복지 방문 인증 및 대시보드</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9821f83fe3895fe4e030aee5107a8990&libraries=services"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #f0f2f5; overflow: hidden; }
        
        #left-menu { width: 260px; background: #1e1e2f; color: #fff; display: flex; flex-direction: column; flex-shrink: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.1); z-index: 20; }
        .menu-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid #2d2d44; color: #ecf0f1; }
        .menu-list { display: flex; flex-direction: column; padding: 15px 10px; gap: 8px; }
        .menu-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 12px 15px; border: none; background: transparent; color: #adb5bd; font-size: 15px; font-weight: bold; text-align: left; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .menu-btn:hover { background: #2a2a40; color: #fff; }
        .menu-btn.active { background: #27ae60; color: #fff; }

        .main-container { flex-grow: 1; height: 100vh; position: relative; background: #f0f2f5; overflow: hidden; }
        .tab-pane { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; box-sizing: border-box; background: #f0f2f5; }
        .tab-pane.active { display: flex; }

        #dash-pane { display: flex; }
        #dash-sidebar { width: 340px; background: #ffffff; padding: 20px; box-sizing: border-box; overflow-y: auto; flex-shrink: 0; z-index: 10; box-shadow: 2px 0 10px rgba(0,0,0,0.05); }
        #map { flex-grow: 1; height: 100%; }

        #auth-pane { justify-content: center; align-items: center; padding: 20px; z-index: 30; }
        .card { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 420px; box-sizing: border-box; }
        h2 { color: #2c3e50; text-align: center; margin-top: 0; }
        label { display: block; margin-top: 18px; font-weight: bold; font-size: 15px; color: #333; }
        select { width: 100%; padding: 12px; margin-top: 8px; border-radius: 6px; border: 1px solid #ccc; font-size: 15px; box-sizing: border-box; background: #fff; }
        .info-msg { font-size: 13px; color: #2980b9; margin-top: 15px; text-align: center; background: #eef2f7; padding: 12px; border-radius: 6px; font-weight: bold; }
        button[type="submit"] { width: 100%; background: #27ae60; color: white; border: none; padding: 15px; border-radius: 6px; font-size: 16px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: 0.2s; }
        button[type="submit"]:hover { background: #219653; }

        .stats-box { background: #eef2f7; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .stats-box h3 { margin: 0 0 4px 0; font-size: 12px; color: #555; }
        .stats-box p { margin: 0; font-size: 16px; font-weight: bold; color: #2980b9; }
        .filter-section { background: #fdfefe; border: 1px solid #dcdde1; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .filter-section h4 { margin: 0 0 4px 0; font-size: 12px; color: #2c3e50; }
        .filter-section select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #bdc3c7; font-size: 12px; box-sizing: border-box; }
        .legend-box { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 8px; }
        .legend-box h4 { margin: 0 0 8px 0; font-size: 12px; color: #333; }
        .legend-item { display: flex; align-items: center; font-size: 11px; margin-bottom: 6px; color: #555; }
        .color-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>

    <div id="left-menu">
        <div class="menu-header">📍 복지 방문 시스템</div>
        <div class="menu-list">
            <button class="menu-btn active" onclick="switchTab('dash-pane', this)">🗺️ 지도 대시보드</button>
            <button class="menu-btn" onclick="switchTab('auth-pane', this)">📍 현장 방문 인증</button>
        </div>
    </div>

    <div class="main-container">
        
        <div id="dash-pane" class="tab-pane active">
            <div id="dash-sidebar">
                <h2>📊 방문 분석</h2>
                <div class="stats-box">
                    <h3>총 방문 건수</h3>
                    <p id="totalCount">0 건 (부산진구 전체)</p>
                </div>

                <div class="filter-section">
                    <h4>🌐 권역별 조회</h4>
                    <select id="regionFilter" onchange="onRegionChange()">
                        <option value="all">전체 권역 보기</option>
                        <option value="1권역">1권역 (부전1·연지·초읍·양정1·2동)</option>
                        <option value="2권역">2권역 (부전2·전포1·2·범천1·2동)</option>
                        <option value="3권역">3권역 (당감1·2·4·부암1·3동)</option>
                        <option value="4권역">4권역 (가야2·개금1·2·3동)</option>
                    </select>
                </div>

                <div class="filter-section">
                    <h4>🏠 동별 조회</h4>
                    <select id="dongFilter" onchange="onDongChange()">
                        <option value="all">전체 동 보기</option>
                        <option value="부전1동">부전1동</option><option value="부전2동">부전2동</option>
                        <option value="연지동">연지동</option><option value="초읍동">초읍동</option>
                        <option value="양정1동">양정1동</option><option value="양정2동">양정2동</option>
                        <option value="전포1동">전포1동</option><option value="전포2동">전포2동</option>
                        <option value="부암1동">부암1동</option><option value="부암3동">부암3동</option>
                        <option value="당감1동">당감1동</option><option value="당감2동">당감2동</option>
                        <option value="당감4동">당감4동</option><option value="가야1동">가야1동</option>
                        <option value="가야2동">가야2동</option><option value="개금1동">개금1동</option>
                        <option value="개금2동">개금2동</option><option value="개금3동">개금3동</option>
                        <option value="범천1동">범천1동</option><option value="범천2동">범천2동</option>
                    </select>
                </div>

                <div class="filter-section">
                    <h4>📅 기간별 조회</h4>
                    <select id="periodFilter" onchange="filterData()">
                        <option value="year">연간 통합 보기 (전체)</option>
                        <option value="1">1월</option><option value="2">2월</option><option value="3">3월</option><option value="4">4월</option>
                        <option value="5">5월</option><option value="6">6월</option><option value="7">7월</option><option value="8">8월</option>
                        <option value="9">9월</option><option value="10">10월</option><option value="11">11월</option><option value="12">12월</option>
                    </select>
                </div>

                <div class="filter-section">
                    <h4>🎯 방문 목적별 필터</h4>
                    <select id="purposeFilter" onchange="filterData()">
                        <option value="all">전체 목적 보기</option>
                        <option value="홍보">홍보</option>
                        <option value="사각지대발굴 활동">사각지대발굴 활동</option>
                        <option value="사례관리(방문)">사례관리(방문)</option>
                    </select>
                </div>

                <div class="legend-box">
                    <h4>🗺️ 방문 횟수별 구역 색상</h4>
                    <div class="legend-item"><span class="color-dot" style="background: #c0392b;"></span><span><b>50회 이상</b> (초집중 관리)</span></div>
                    <div class="legend-item"><span class="color-dot" style="background: #e67e22;"></span><span><b>10회~30회</b> (중점 방문)</span></div>
                    <div class="legend-item"><span class="color-dot" style="background: #3498db;"></span><span><b>1회~10회</b> (기본 방문)</span></div>
                </div>
            </div>
            <div id="map"></div>
        </div>

        <div id="auth-pane" class="tab-pane">
            <div class="card">
                <h2>📍 복지 방문 인증</h2>
                <form id="visitForm">
                    <label>🎯 방문 목적 선택</label>
                    <select id="purpose">
                        <option value="홍보">홍보</option>
                        <option value="사각지대발굴 활동">사각지대발굴 활동</option>
                        <option value="사례관리(방문)">사례관리(방문)</option>
                    </select>
                    <div class="info-msg">💡 전송 버튼을 누르면 현재 위치가 자동으로 기록됩니다.</div>
                    <button type="submit" id="submitBtn">인증 데이터 전송하기</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchTab(paneId, btn) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.menu-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');
            btn.classList.add('active');
            if(paneId === 'dash-pane' && map) {
                setTimeout(() => { map.relayout(); }, 100);
            }
        }

        var container = document.getElementById('map');
        var options = { center: new kakao.maps.LatLng(35.1631, 129.0532), level: 5, minLevel: 3, maxLevel: 7 };
        var map = new kakao.maps.Map(container, options);

        // 제공받은 정밀 GeoJSON 데이터 내장
        const geojson锡 = {
            "type": "FeatureCollection",
            "name": "busanjin",
            "features": [
                { "type": "Feature", "properties": { "ADM_CD": "21050520", "ADM_NM": "부전2동" }, "geometry": { "type": "Polygon", "coordinates": [ [ [129.062313, 35.156288], [129.062301, 35.157233], [129.062296, 35.157747], [129.064044, 35.157749], [129.064816, 35.157754], [129.065434, 35.157757], [129.066101, 35.157761], [129.067199, 35.157776], [129.068168, 35.157798], [129.068184, 35.158083], [129.068134, 35.158211], [129.068067, 35.158516], [129.068052, 35.158586], [129.067978, 35.158924], [129.067984, 35.158939], [129.067988, 35.158948], [129.067993, 35.158955], [129.067999, 35.158962], [129.068073, 35.158970], [129.068124, 35.158975], [129.068205, 35.158984], [129.068272, 35.158991], [129.068398, 35.158991], [129.068487, 35.159006], [129.068583, 35.159014], [129.068943, 35.159016], [129.068993, 35.159018], [129.069040, 35.159019], [129.069053, 35.159020], [129.069186, 35.159025], [129.069429, 35.159035], [129.069518, 35.158989], [129.069549, 35.158987], [129.069546, 35.158871], [129.069596, 35.158871], [129.069611, 35.158876], [129.069730, 35.158881], [129.069829, 35.158881], [129.069846, 35.158881], [129.069844, 35.158874], [129.069921, 35.158840], [129.069958, 35.158824], [129.070128, 35.158564], [129.070143, 35.158541], [129.070163, 35.158510], [129.070176, 35.158490], [129.070157, 35.158481], [129.070100, 35.158456], [129.069916, 35.158380], [129.069846, 35.158344], [129.069823, 35.158332], [129.069812, 35.158089], [129.069811, 35.158068], [129.069800, 35.157797], [129.069830, 35.157712], [129.070065, 35.157770], [129.070234, 35.157812], [129.070265, 35.157821], [129.070333, 35.157842], [129.070530, 35.157904], [129.070818, 35.157993], [129.070896, 35.158017], [129.070921, 35.158029], [129.070927, 35.158031], [129.070929, 35.158032], [129.070937, 35.158035], [129.070942, 35.158037], [129.070942, 35.158038], [129.070962, 35.158046], [129.070999, 35.158062], [129.071104, 35.158108], [129.071197, 35.158112], [129.071237, 35.158114], [129.071252, 35.158115], [12                 { "type": "Feature", "properties": { "ADM_CD": "21050540", "ADM_NM": "연지동" }, "geometry": { "type": "Polygon", "coordinates": [ [ [129.055751, 35.176931], [129.057609, 35.176837], [129.057613, 35.176777], [129.057679, 35.176268], [129.057527, 35.176251], [129.057409, 35.176237], [129.056719, 35.176146], [129.056639, 35.176139], [129.056591, 35.176184], [129.056404, 35.176361], [129.056354, 35.176408], [129.056175, 35.176578], [129.056132, 35.176618], [129.056132, 35.176666], [129.056131, 35.176722], [129.056131, 35.176734], [129.056131, 35.176743], [129.056086, 35.176778], [129.056079, 35.176783], [129.055968, 35.176868], [129.055905, 35.176900], [129.055871, 35.176921], [129.055845, 35.176925], [129.055816, 35.176918], [129.055779, 35.176910], [129.055751, 35.176931] ] ] } }
            ]
        };

        let allVisitData = [];
        let activeCircles = [];
        let polygonOverlays = [];

        function clearMap() {
            activeCircles.forEach(c => c.setMap(null));
            activeCircles = [];
            polygonOverlays.forEach(p => p.setMap(null));
            polygonOverlays = [];
        }

        // 카카오맵 데이터오버레이(GeoJSON) 활용하여 정확한 행정구역 경계 그리기
        function drawGeoJsonPolygon(targetDongName) {
            clearMap();
            
            geojson锡.features.forEach(feature => {
                var dongName = feature.properties.ADM_NM;
                if (targetDongName === 'all' || dongName === targetDongName) {
                    var coordinates = feature.geometry.coordinates;
                    
                    coordinates.forEach(ring => {
                        var path = ring.map(coord => new kakao.maps.LatLng(coord[1], coord[0]));
                        
                        var polygon = new kakao.maps.Polygon({
                            path: path,
                            strokeWeight: 3,
                            strokeColor: targetDongName === 'all' ? '#27ae60' : '#e74c3c',
                            strokeOpacity: 0.8,
                            fillColor: targetDongName === 'all' ? '#27ae60' : '#e74c3c',
                            fillOpacity: 0.15
                        });
                        polygon.setMap(map);
                        polygonOverlays.push(polygon);
                    });
                }
            });
        }

        const regionMap = {
            "1권역": ["부전1동", "연지동", "초읍동", "양정1동", "양정2동"],
            "2권역": ["부전2동", "전포1동", "전포2동", "범천1동", "범천2동"],
            "3권역": ["당감1동", "당감2동", "당감4동", "부암1동", "부암3동"],
            "4권역": ["가야2동", "개금1동", "개금2동", "개금3동"]
        };

        function onRegionChange() {
            document.getElementById('dongFilter').value = 'all';
            var region = document.getElementById('regionFilter').value;
            clearMap();

            if (region !== 'all') {
                var dongs = regionMap[region] || [];
                dongs.forEach(dName => drawGeoJsonPolygon(dName));
                map.setCenter(new kakao.maps.LatLng(35.1631, 129.0532));
                map.setLevel(5);
            } else {
                map.setCenter(new kakao.maps.LatLng(35.1631, 129.0532));
                map.setLevel(5);
            }
            filterData();
        }

        function onDongChange() {
            document.getElementById('regionFilter').value = 'all';
            var dong = document.getElementById('dongFilter').value;
            
            if (dong !== 'all') {
                drawGeoJsonPolygon(dong);
                // 해당 동 위치로 이동하는 로직 (선택적)
            } else {
                clearMap();
                map.setCenter(new kakao.maps.LatLng(35.1631, 129.0532));
                map.setLevel(5);
            }
            filterData();
        }

        function filterData() {
            var selectedRegion = document.getElementById('regionFilter').value;
            var selectedDong = document.getElementById('dongFilter').value;
            var selectedPeriod = document.getElementById('periodFilter').value;
            var selectedPurpose = document.getElementById('purposeFilter').value;

            activeCircles.forEach(c => c.setMap(null));
            activeCircles = [];

            var filtered = allVisitData.filter(item => {
                var itemDong = String(item.dong || "").trim();
                var matchRegion = true;
                if (selectedDong === 'all' && selectedRegion !== 'all') {
                    var allowedDongs = regionMap[selectedRegion] || [];
                    matchRegion = allowedDongs.includes(itemDong);
                }
                var matchDong = (selectedDong === 'all' || itemDong === selectedDong);
                var matchPeriod = (selectedPeriod === 'year' || String(item.period).trim() === String(selectedPeriod));
                var matchPurpose = (selectedPurpose === 'all' || String(item.purpose).trim() === String(selectedPurpose));

                return matchRegion && matchDong && matchPeriod && matchPurpose;
            });

            var totalSum = filtered.reduce((sum, item) => sum + Number(item.count || 1), 0);
            document.getElementById('totalCount').innerText = totalSum + " 건 (선택 지역)";

            filtered.forEach(item => {
                var position = new kakao.maps.LatLng(Number(item.lat), Number(item.lng));
                var cnt = Number(item.count || 1);
                var radiusSize, circleColor;
                if (cnt >= 50) { radiusSize = 220; circleColor = '#c0392b'; }
                else if (cnt >= 10) { radiusSize = 160; circleColor = '#e67e22'; }
                else { radiusSize = 110; circleColor = '#3498db'; }

                var circle = new kakao.maps.Circle({
                    center: position, radius: radiusSize, strokeWeight: 2, strokeColor: circleColor, strokeOpacity: 0.9, fillColor: circleColor, fillOpacity: 0.45
                });
                circle.setMap(map);
                activeCircles.push(circle);

                var infowindow = new kakao.maps.InfoWindow({
                    content: '<div style="padding:6px 10px; font-size:12px; font-weight:bold;">📍 ' + (item.title || '현장 방문') + '<br>동: ' + (item.dong || '미지정') + '<br>목적: ' + item.purpose + '<br>방문: ' + cnt + '회</div>'
                });

                kakao.maps.event.addListener(circle, 'mouseover', () => infowindow.setPosition(position) || infowindow.open(map, circle));
                kakao.maps.event.addListener(circle, 'mouseout', () => infowindow.close());
            });
        }

        const sheetId = '1Qcqw-8UQPIVtgZLrpE3cD8qXH97qbHG9YL1Ww0GcJZQ';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        function loadSheetData() {
            fetch(url)
                .then(res => res.text())
                .then(text => {
                    const json = JSON.parse(text.substring(47).slice(0, -2));
                    const rows = json.table.rows;

                    allVisitData = rows.map(row => ({
                        title: (row.c[0] && row.c[0].v) ? row.c[0].v : '현장 방문',
                        lat: (row.c[1] && row.c[1].v) ? row.c[1].v : 35.1631,
                        lng: (row.c[2] && row.c[2].v) ? row.c[2].v : 129.0532,
                        purpose: (row.c[3] && row.c[3].v) ? row.c[3].v : '홍보',
                        period: (row.c[4] && row.c[4].v) ? row.c[4].v : '8',
                        count: (row.c[5] && row.c[5].v) ? row.c[5].v : 1,
                        dong: (row.c[6] && row.c[6].v) ? row.c[6].v : '부전2동'
                    }));

                    filterData();
                })
                .catch(err => console.error("구글 시트 데이터 로드 실패:", err));
        }

        loadSheetData();

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2XwMqXTalERQxGKaNUPjoL6pB3AZkzRn6VWZ9IGsKVneCvpiRKQHdN9QRIjvE89I/exec";

        document.getElementById('visitForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.innerText = "위치 확인 및 전송 중...";
            btn.disabled = true;

            const currentMonth = String(new Date().getMonth() + 1);

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    sendData(position.coords.latitude, position.coords.longitude, currentMonth);
                }, function(error) {
                    sendData(35.1631, 129.0532, currentMonth);
                }, { enableHighAccuracy: true, timeout: 6000, maximumAge: 0 });
            } else {
                sendData(35.1631, 129.0532, currentMonth);
            }
        });

        function sendData(lat, lng, period) {
            const data = {
                title: "현장 방문",
                lat: lat,
                lng: lng,
                purpose: document.getElementById('purpose').value,
                period: period,
                count: 1,
                dong: "부전2동"
            };

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            }).then(() => {
                alert('방문 인증이 성공적으로 완료되었습니다!');
                const btn = document.getElementById('submitBtn');
                btn.innerText = "인증 데이터 전송하기";
                btn.disabled = false;
                document.getElementById('visitForm').reset();
                setTimeout(loadSheetData, 1500);
            }).catch(error => {
                alert('전송 실패: ' + error);
                const btn = document.getElementById('submitBtn');
                btn.innerText = "인증 데이터 전송하기";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
