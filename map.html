<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>복지 방문 데이터 통합 대시보드</title>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9821f83fe3895fe4e030aee5107a8990&libraries=services"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; margin: 0; padding: 0; display: flex; height: 100vh; background: #f0f2f5; }
        #sidebar { width: 360px; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; z-index: 10; overflow-y: auto; }
        h2 { font-size: 20px; color: #2c3e50; margin-top: 0; }
        .stats-box { background: #eef2f7; padding: 12px 15px; border-radius: 8px; margin-bottom: 12px; }
        .stats-box h3 { margin: 0 0 6px 0; font-size: 13px; color: #555; }
        .stats-box p { margin: 0; font-size: 16px; font-weight: bold; color: #2980b9; }
        .filter-section { background: #fdfefe; border: 1px solid #dcdde1; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .filter-section h4 { margin: 0 0 6px 0; font-size: 13px; color: #2c3e50; }
        .filter-section select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #bdc3c7; font-size: 13px; box-sizing: border-box; }
        .legend-box { background: #fff; border: 1px solid #ddd; padding: 12px; border-radius: 8px; margin-bottom: 12px; }
        .legend-box h4 { margin: 0 0 8px 0; font-size: 13px; color: #333; }
        .legend-item { display: flex; align-items: center; font-size: 12px; margin-bottom: 6px; color: #555; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        #map { flex-grow: 1; height: 100%; }
        .info-desc { font-size: 12px; color: #666; margin-top: auto; line-height: 1.4; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>📊 기관별 방문 분석</h2>
        <div class="stats-box">
            <h3>총 방문 건수</h3>
            <p id="totalCount">0 건 (부산진구 전체)</p>
        </div>

        <div class="filter-section">
            <h4>📅 기간별 조회</h4>
            <select id="periodFilter" onchange="filterData()">
                <option value="year">연간 통합 보기 (전체)</option>
                <option value="1">1월</option>
                <option value="2">2월</option>
                <option value="3">3월</option>
                <option value="4">4월</option>
                <option value="5">5월</option>
                <option value="6">6월</option>
                <option value="7">7월</option>
                <option value="8">8월</option>
                <option value="9">9월</option>
                <option value="10">10월</option>
                <option value="11">11월</option>
                <option value="12">12월</option>
            </select>
        </div>

        <div class="filter-section">
            <h4>🎯 방문 목적별 필터</h4>
            <select id="purposeFilter" onchange="filterData()">
                <option value="all">전체 목적 보기</option>
                <option value="홍보">홍보</option>
                <option value="사각지대발굴 활동">사각지대발굴 활동</option>
                <option value="사례관리(방문)">사례관리(방문)</option>
            </select>
        </div>

        <div class="legend-box">
            <h4>🗺️ 방문 횟수별 구역 색상</h4>
            <div class="legend-item"><span class="color-dot" style="background: #c0392b;"></span><span><b>50회 이상</b> (초집중 관리 지역)</span></div>
            <div class="legend-item"><span class="color-dot" style="background: #e67e22;"></span><span><b>10회 ~ 30회</b> (중점 방문 지역)</span></div>
            <div class="legend-item"><span class="color-dot" style="background: #3498db;"></span><span><b>1회 ~ 10회</b> (기본 방문 / 관심 지역)</span></div>
        </div>

        <div class="info-desc">
            💡 <b>안내:</b> 구글 시트 데이터가 실시간 연동되어 지도에 표시됩니다.
        </div>
    </div>

    <div id="map"></div>

    <script>
        var container = document.getElementById('map');
        var options = {
            center: new kakao.maps.LatLng(35.1631, 129.0532), 
            level: 5,
            minLevel: 3,
            maxLevel: 7
        };
        var map = new kakao.maps.Map(container, options);

        var busanjinPath = [
            new kakao.maps.LatLng(35.1850, 129.0350),
            new kakao.maps.LatLng(35.1880, 129.0600),
            new kakao.maps.LatLng(35.1750, 129.0820),
            new kakao.maps.LatLng(35.1550, 129.0780),
            new kakao.maps.LatLng(35.1350, 129.0620),
            new kakao.maps.LatLng(35.1380, 129.0400),
            new kakao.maps.LatLng(35.1520, 129.0150)
        ];
        var busanjinPolygon = new kakao.maps.Polygon({
            path: busanjinPath,
            strokeWeight: 3,
            strokeColor: '#27ae60',
            strokeOpacity: 0.8,
            fillColor: '#27ae60',
            fillOpacity: 0.06
        });
        busanjinPolygon.setMap(map);

        let allVisitData = [];
        let activeCircles = [];

        function clearMap() {
            activeCircles.forEach(c => c.setMap(null));
            activeCircles = [];
        }

        function filterData() {
            clearMap();
            var selectedPeriod = document.getElementById('periodFilter').value;
            var selectedPurpose = document.getElementById('purposeFilter').value;

            var filtered = allVisitData.filter(item => {
                var matchPeriod = (selectedPeriod === 'year' || String(item.period).trim() === String(selectedPeriod));
                var matchPurpose = (selectedPurpose === 'all' || String(item.purpose).trim() === String(selectedPurpose));
                return matchPeriod && matchPurpose;
            });

            var totalSum = filtered.reduce((sum, item) => sum + Number(item.count || 1), 0);
            document.getElementById('totalCount').innerText = totalSum + " 건 (부산진구 전체)";

            filtered.forEach(item => {
                var position = new kakao.maps.LatLng(Number(item.lat), Number(item.lng));
                var cnt = Number(item.count || 1);
                var radiusSize, circleColor;
                if (cnt >= 50) { radiusSize = 220; circleColor = '#c0392b'; }
                else if (cnt >= 10) { radiusSize = 160; circleColor = '#e67e22'; }
                else { radiusSize = 110; circleColor = '#3498db'; }

                var circle = new kakao.maps.Circle({
                    center: position,
                    radius: radiusSize, 
                    strokeWeight: 2,
                    strokeColor: circleColor,
                    strokeOpacity: 0.9,
                    fillColor: circleColor,
                    fillOpacity: 0.45
                });
                circle.setMap(map);
                activeCircles.push(circle);

                var infowindow = new kakao.maps.InfoWindow({
                    content: '<div style="padding:6px 10px; font-size:12px; font-weight:bold;">📍 ' + (item.title || '현장 방문') + '<br>목적: ' + item.purpose + '<br>방문: ' + cnt + '회</div>'
                });

                kakao.maps.event.addListener(circle, 'mouseover', () => infowindow.setPosition(position) || infowindow.open(map, circle));
                kakao.maps.event.addListener(circle, 'mouseout', () => infowindow.close());
            });
        }

        const sheetId = '1Qcqw-8UQPIVtgZLrpE3cD8qXH97qbHG9YL1Ww0GcJZQ';
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        fetch(url)
            .then(res => res.text())
            .then(text => {
                const json = JSON.parse(text.substring(47).slice(0, -2));
                const rows = json.table.rows;

                allVisitData = rows.map(row => ({
                    title: (row.c[0] && row.c[0].v) ? row.c[0].v : '현장 방문',
                    lat: (row.c[1] && row.c[1].v) ? row.c[1].v : 35.1631,
                    lng: (row.c[2] && row.c[2].v) ? row.c[2].v : 129.0532,
                    purpose: (row.c[3] && row.c[3].v) ? row.c[3].v : '홍보',
                    period: (row.c[4] && row.c[4].v) ? row.c[4].v : '8',
                    count: (row.c[5] && row.c[5].v) ? row.c[5].v : 1
                }));

                filterData();
            })
            .catch(err => console.error("구글 시트 데이터 로드 실패:", err));
    </script>
</body>
</html>
